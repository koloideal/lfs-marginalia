set default=0
set timeout=10

insmod part_msdos
insmod ext2
insmod all_video
insmod gfxterm
insmod font
insmod png
set gfxmode=auto
loadfont /boot/grub/fonts/dejavu-mono.pf2
terminal_input gfxterm
terminal_output gfxterm
background_image /boot/grub/background.png

set color_normal=black/black
set menu_color_normal=black/black
set menu_color_highlight=black/light-cyan
set gfxpayload=1280x800x32

menuentry "GNU/Linux, Linux 7.2.10-lfs13.1-kolo" {
    linux /boot/vmlinuz-7.2.10-lfs13.1-kolo root=PARTUUID=bace5795-02 ro fbcon=logo-pos:right,logo-count:1
}

menuentry "LFS: аварийная оболочка" {
    linux /boot/vmlinuz-7.2.10-lfs13.1-kolo root=PARTUUID=bace5795-02 ro init=/bin/bash
}
